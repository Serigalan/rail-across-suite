name: Release desktop app

# The desktop app as a GitHub release (decision 0021: it takes the place of the local build's zip): pushing a
# tag rail-across-suite-vX.Y (a version of the suite) or desktop-YYYY-MM-DD[.n] builds the app with the project
# server in its process (crates/desktop) for Windows and attaches it to a release of that tag — the portable
# package only, a ZIP of one folder (crates/desktop/portable/), no installer. It is built without mdb-export: the
# MDB import says the tool is missing (scripts/stage-mdbtools.mjs finds none on the runner). macOS is not
# released for now; Linux is built and smoke-checked by CI. Run by hand, it builds the package as the run's
# artifact and releases nothing — the way to try a release before its tag.

on:
  push:
    tags: ['rail-across-suite-v*', 'desktop-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install tauri-cli --version '^2' --locked
      # The program alone, no installer; runs scripts/build-site.mjs and scripts/stage-mdbtools.mjs itself
      # (tauri.conf.json).
      - run: cargo tauri build --no-bundle
        working-directory: crates/desktop
      # The portable package: the program and the suite in one folder with the file `portable`, which keeps
      # everything the app stores in that folder (src/main.rs).
      - shell: pwsh
        working-directory: crates/desktop
        run: |
          $dir = "target/portable/Rail-Across-Suite"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/rail-across-desktop.exe "$dir/Rail-Across-Suite.exe"
          Copy-Item -Recurse site "$dir/site"
          Copy-Item portable/* $dir
          $version = "${{ github.ref_name }}" -replace '^rail-across-suite-v', '' -replace '^desktop-', ''
          Compress-Archive -Path $dir -DestinationPath "target/portable/Rail-Across-Suite-$version-windows-portable.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-portable
          path: crates/desktop/target/portable/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/rail-across-suite-v') || startsWith(github.ref, 'refs/tags/desktop-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: packages
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#desktop-}"
          version="${version#rail-across-suite-v}"
          find packages -type f > files.txt
          cat > release-notes.md <<EOF
          Rail-Across-Suite for Windows, version ${version}: the suite with its project server in one window, no server and no Node needed.

          - **Portable:** unpack \`…-windows-portable.zip\` and start \`Rail-Across-Suite.exe\`; everything stays in that folder. Not signed: SmartScreen warns on the first start (More info → Run anyway). Needs WebView2 (part of Windows 11 and current Windows 10).
          - **Template:** the project *PEK Halle-Könnern (Testdaten)* with its timetables — test data to try the suite on, not binding planning data.
          - **Without mdbtools:** the MDB import (Gleisnetzdaten) is not part of this package.
          EOF
          xargs -d '\n' -a files.txt gh release create "$GITHUB_REF_NAME" --title "Rail-Across-Suite ${version}" --notes-file release-notes.md --verify-tag
