[package]
name = "rail-across-suite-desktop"
version = "0.1.0"
description = "The local package of Rail-Across-Suite: the whole suite in one window, on a local server without user management"
license = "LGPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"

[profile.release]
opt-level = 2
