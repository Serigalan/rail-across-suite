[workspace]
resolver = "2"
members = ["crates/optimizer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"
repository = "https://github.com/Serigalan/rail-across-suite"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# The catalogue's thresholds and inputs are read in the order the file lists
# them: a later one may use an earlier.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
