name: CI

on:
  push:
  pull_request:

jobs:
  # The repository's own rules: the packages' lint and the import boundaries between apps and packages.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # ESLint for the packages (npm run lint) comes from the workspace.
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  # The Rail-Data-Core: its tests and its module rules.
  core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      # The core's Rust crates as its WebAssembly module (decision 0020): the
      # tests run on it where a function has moved, and hold it to the JavaScript.
      - run: rustup target add wasm32-unknown-unknown
      - run: npm run wasm
      - run: node tools/modules.mjs
      - run: node tools/vectors.mjs --check
      - run: node tools/types.mjs --check
      - run: npm test

  # Point clouds, shared by the Open-Layout-Tool and the project server.
  pointcloud:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/pointcloud
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      # The core's Rust module (decision 0020), which the core's functions run on.
      - run: rustup target add wasm32-unknown-unknown && node packages/core/scripts/wasm.mjs
        working-directory: .
      # The import as a WebAssembly module (crates/pointcloud-wasm), which the tests run.
      - run: rustup target add wasm32-unknown-unknown
      - run: npm run wasm
      - run: npm test

  # The suite's look as a library, shared by the start page and the modules.
  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      - run: npm test

  # The suite's vehicles, shared by the Fahrzeug-Editor and the Fahrplan-Sim.
  vehicles:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/vehicles
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      # The core's Rust module (decision 0020), which the core's functions run on.
      - run: rustup target add wasm32-unknown-unknown && node packages/core/scripts/wasm.mjs
        working-directory: .
      - run: npm test

  # The running times — the way over the net, the stations along it, the
  # simulation module — and the timetables, shared by the Simulation-Tool and
  # the Fahrplan-Editor; with the module built from sim/, so the tests that
  # run it run too.
  running-times:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --release -p rail-across-sim-wasm --target wasm32-unknown-unknown
      # The core's Rust module (decision 0020), which the core's functions run on.
      - run: node packages/core/scripts/wasm.mjs
      - run: npm test
        working-directory: packages/running-times
      - run: npm test
        working-directory: packages/timetables

  # The local working copies, shared by the tools and the start page.
  working-copy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/working-copy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      # The core's Rust module (decision 0020), which the core's functions run on.
      - run: rustup target add wasm32-unknown-unknown && node packages/core/scripts/wasm.mjs
        working-directory: .
      - run: npm test

  # The basemaps, shared by the Layout-Tool and the Signalling-Tool.
  basemaps:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/basemaps
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      - run: npm test

  # The Signalling-Tool.
  signalling-tool:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/signalling-tool
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      # The core's Rust module (decision 0020), which the core's functions run on.
      - run: rustup target add wasm32-unknown-unknown && node packages/core/scripts/wasm.mjs
        working-directory: .
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # All of the suite's Rust, one cargo workspace (decision 0020): the
  # simulation core with OSRD's cases, the crossover search, the optimizer with
  # the shared rule vectors, the core's crates with the vectors the JavaScript
  # core records; clippy and the format; the core's WebAssembly module.
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release -p rail-across-core-wasm --target wasm32-unknown-unknown

  # The project server's tests (server/test) against it (crates/server,
  # decision 0020) over HTTP, its command line and its jobs.
  project-server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      # The core's Rust module (decision 0020), which the core's functions run on.
      - run: rustup target add wasm32-unknown-unknown && node packages/core/scripts/wasm.mjs
        working-directory: .
      - run: cargo build --release -p rail-across-server
        working-directory: .
      - run: npx vitest run

  # The desktop app (decision 0020, step 9): Tauri with the project server in
  # its own process, a cargo workspace of its own for WebKitGTK; its smoke
  # check under Xvfb loads a page through the app's URI scheme and asks the API.
  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/desktop
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev xvfb mdbtools
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: node scripts/stage-mdbtools.mjs
      - run: cargo build
      # Portable, as the Windows package runs: the working files in the folder's data/.
      - run: |
          mkdir -p "$RUNNER_TEMP/site" && echo '<!doctype html><title>Smoke</title>' > "$RUNNER_TEMP/site/index.html"
          RA_DESKTOP_SITE="$RUNNER_TEMP/site" RA_DESKTOP_PORTABLE="$RUNNER_TEMP/portable" xvfb-run -a target/debug/rail-across-desktop --smoke
          test -f "$RUNNER_TEMP/portable/data/rail-across.sqlite"

  # The same on Windows, where the portable package is the one shipped: WebView2, the scheme's
  # http://rail.localhost/ address, the Windows-only code of the app and the server.
  desktop-windows:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        working-directory: crates/desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - run: cargo clippy -- -D warnings
      - run: cargo build
      - timeout-minutes: 5
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/site" | Out-Null
          Set-Content "$env:RUNNER_TEMP/site/index.html" '<!doctype html><title>Smoke</title>'
          $env:RA_DESKTOP_SITE = "$env:RUNNER_TEMP/site"
          $env:RA_DESKTOP_PORTABLE = "$env:RUNNER_TEMP/portable"
          target/debug/rail-across-desktop.exe --smoke
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$env:RUNNER_TEMP/portable/data/rail-across.sqlite")) { throw 'no database in the portable folder' }

  # The Simulation-Tool's old address, which leads on to the Fahrplan-Editor.
  simulation-tool:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/simulation-tool
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The Fahrzeug-Editor.
  vehicle-editor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/vehicle-editor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      # The core's Rust module (decision 0020), which the core's functions run on.
      - run: rustup target add wasm32-unknown-unknown && node packages/core/scripts/wasm.mjs
        working-directory: .
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The Fahrplan-Editor, with the simulation module built from sim/, so the tests
  # that run trains (OSRD's example vehicles among them) run too.
  timetable-editor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/timetable-editor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      # The core's Rust module (decision 0020), which the core's functions run on.
      - run: rustup target add wasm32-unknown-unknown && node packages/core/scripts/wasm.mjs
        working-directory: .
      - run: rustup target add wasm32-unknown-unknown
      - run: npm run sim
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The start page of the suite.
  home:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/home
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      # The core's Rust module (decision 0020), which the core's functions run on.
      - run: rustup target add wasm32-unknown-unknown && node packages/core/scripts/wasm.mjs
        working-directory: .
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The Open-Layout-Tool, with the project server for its merge tests.
  layout-tool:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/layout-tool
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # One install for the whole workspace: apps, packages and the server.
      - run: npm ci --no-audit --no-fund
        working-directory: .
      # The core's Rust module (decision 0020), which the core's functions run on.
      - run: rustup target add wasm32-unknown-unknown && node packages/core/scripts/wasm.mjs
        working-directory: .
      - run: node tools/data.mjs
      - run: npm run lint
      - run: npm run knip
      - run: npm run i18n:unused
      - run: node tools/modules.mjs
      - run: node tools/docs.mjs
      # The Rust modules beside the page (decisions 0018, 0019), so the tests
      # that run them run too and the builds carry them.
      - run: rustup target add wasm32-unknown-unknown
      - run: npm run crossover
      - run: npm run optimizer
      - run: npm run pointcloud
      # The project server, for the tests that work against it (variantMerge).
      - run: cargo build --release -p rail-across-server
      - run: npm test
      - run: npx vite build --outDir /tmp/olt-dist

  # The suite's deployment (deploy/) and the Layout-Tool's check script.
  deploy-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash -n deploy/setup.sh && bash -n deploy/deploy.sh && bash -n deploy/lib.sh && bash -n deploy/release.sh && bash -n deploy/monitor.sh
      - run: shellcheck -x deploy/setup.sh deploy/deploy.sh deploy/lib.sh deploy/release.sh deploy/monitor.sh
      - run: shellcheck -x tools/check.sh
        working-directory: apps/layout-tool
