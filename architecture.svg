<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" aria-labelledby="t d">
  <title>Rail-Across-Suite architecture</title>
  <desc>
    Four modules access the shared Rail-Data-Core, which feeds three simulations.
  </desc>
  <g font-family="anthropic-sans,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <rect x="20" y="20" width="640" height="540" rx="20" fill="none" stroke="#303383" stroke-width="4"/>
    <svg x="35" y="32" width="100" height="70" viewBox="160 40 320 220" aria-label="Rail-Across-Suite logo">
