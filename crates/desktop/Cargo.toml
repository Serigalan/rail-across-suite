[package]
name = "rail-across-desktop"
description = "Rail-Across-Suite on the desktop: the whole suite in one Tauri window, the project server in the same process"
version = "0.2.0"
edition = "2021"
license = "LGPL-3.0-only"
repository = "https://github.com/Serigalan/rail-across-suite"
publish = false

# A workspace of its own: Tauri needs WebKitGTK (Linux) to build, the
# server and the core's crates do not. It shares their code by path.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rail-across-server = { path = "../server" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
