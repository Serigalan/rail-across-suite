[package]
name = "rail-across-core-wasm"
description = "The core's Rust crates as one WebAssembly module, behind the core's JavaScript face"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json.workspace = true
rail-across-doc = { path = "../doc" }
rail-across-js = { path = "../js" }
rail-across-geom = { path = "../geom" }
rail-across-rules = { path = "../rules" }
rail-across-track = { path = "../track" }
rail-across-survey = { path = "../survey" }
rail-across-project = { path = "../project" }
rail-across-switch = { path = "../switch" }
rail-across-commands = { path = "../commands" }
rail-across-signalling = { path = "../signalling" }
rail-across-planpro = { path = "../planpro" }
