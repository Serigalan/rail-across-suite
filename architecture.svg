<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" aria-labelledby="t d"><title>Open-Rail-Designer architecture</title><desc>Six modules access the shared Rail-Data-Core.</desc><g font-family="anthropic-sans,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"><rect x="20" y="20" width="640" height="450" rx="20" fill="none" stroke="#303383" stroke-width="4"/><svg x="35" y="32" width="100" height="70" viewBox="160 40 320 220" aria-label="Open Rail Designer logo"><path d="M250 50v200" stroke="#888780" stroke-dasharray="3 4" opacity=".6" fill="none" vector-effect="non-scaling-stroke"/><path d="M250 50h-26.6q-16.9 0-16.9 16.9v39.4l24.5 6.5q8.6 2.2 8.6 10.2v75q0 11-10.6 14.5l-56.7 21.2q-3.5 1.3-3.5 4.9v7.7q0 3.7 3.9 3.7H250" fill="none" stroke="#303383" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="250" cy="50" r="5" fill="#303383"/><circle cx="250" cy="250" r="5" fill="#303383"/><g font-size="44" font-weight="500" fill="#0b0b0b"><text x="278" y="115">open</text><text x="278" y="165">rail</text><text x="278" y="215">designer</text></g></svg><text x="230" y="73" font-size="24" font-weight="500" fill="#0b0b0b">Open-Rail-Designer</text><rect x="40" y="110" width="600" height="226" rx="14" fill="none" stroke="#303383" stroke-width="1.5" stroke-dasharray="3 5"/><text x="54" y="130" font-size="12" fill="#52514e">Modules</text><rect x="54" y="146" width="278" height="52" rx="10" fill="none" stroke="#888780" stroke-width="3"/><text x="193" y="168" text-anchor="middle" font-size="14" font-weight="500" fill="#0b0b0b">Open-Layout-Tool</text><text x="193" y="187" text-anchor="middle" font-size="12" fill="#52514e">Track layout (existing)</text><rect x="348" y="146" width="278" height="52" rx="10" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="6 5"/><text x="487" y="168" text-anchor="middle" font-size="14" font-weight="500" fill="#0b0b0b">Open-Catenary-Tool</text><text x="487" y="187" text-anchor="middle" font-size="12" fill="#52514e">Overhead line (planned)</text><rect x="54" y="208" width="278" height="52" rx="10" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="6 5"/><text x="193" y="230" text-anchor="middle" font-size="14" font-weight="500" fill="#0b0b0b">Open-Signalling-Tool</text><text x="193" y="249" text-anchor="middle" font-size="12" fill="#52514e">Control, command and signalling (planned)</text><rect x="348" y="208" width="278" height="52" rx="10" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="6 5"/><text x="487" y="230" text-anchor="middle" font-size="14" font-weight="500" fill="#0b0b0b">Open-Construction-Sim</text><text x="487" y="249" text-anchor="middle" font-size="12" fill="#52514e">Construction simulation (planned)</text><rect x="54" y="270" width="278" height="52" rx="10" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="6 5"/><text x="193" y="292" text-anchor="middle" font-size="14" font-weight="500" fill="#0b0b0b">Open-Capacity-Sim</text><text x="193" y="311" text-anchor="middle" font-size="12" fill="#52514e">Capacity simulation (planned)</text><rect x="348" y="270" width="278" height="52" rx="10" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="6 5"/><text x="487" y="292" text-anchor="middle" font-size="14" font-weight="500" fill="#0b0b0b">Open-Timetable-Tool</text><text x="487" y="311" text-anchor="middle" font-size="12" fill="#52514e">Timetable construction (planned)</text><path d="M340 351v24" fill="none" stroke="#303383" stroke-width="4" stroke-linecap="round"/><circle cx="340" cy="348" r="5" fill="#303383"/><circle cx="340" cy="378" r="5" fill="#303383"/><rect x="54" y="392" width="572" height="56" rx="14" fill="none" stroke="#888780" stroke-width="4"/><text x="340" y="415" text-anchor="middle" font-size="14" font-weight="500" fill="#0b0b0b">Rail-Data-Core</text><text x="340" y="435" text-anchor="middle" font-size="12" fill="#52514e">Shared data foundation for