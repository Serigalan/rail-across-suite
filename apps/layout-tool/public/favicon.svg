<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- The Layout-Tool's mark: an alignment of a straight, a transition and an arc leaving the straight, its
       elements' ends marked. Small (a tab) as drawn; from 48 px on with the straight's tangent on, dashed, in the
       second blue. -->
  <style>
    .detail { display: none }
    @media (min-width: 48px) { .detail { display: inline } }
  </style>
  <rect width="200" height="200" rx="42" fill="#303383"/>
  <path class="detail" d="M72 150H180" fill="none" stroke="#8d8fbb" stroke-width="10" stroke-dasharray="12 18" stroke-linecap="round"/>
  <path d="M20 150H72C104 150 116 130 128 106C140 78 152 58 180 50" fill="none" stroke="#ffffff" stroke-width="14"
    stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="72" cy="150" r="14" fill="#ffffff"/>
  <circle cx="128" cy="106" r="14" fill="#ffffff"/>
</svg>
